<!DOCTYPE html>
<html>

<head>
    <title>List</title>
</head>

<body>

    <p style="color: red; background-color: green; font-family: fantasy; font-size: 28px;">
        I hope
    </p>

    <h1>List</h1>

    <!-- Ordered List -->
    <ol>
        <li>Operating System</li>
    </ol>

    <!-- Ordered List with alphabet -->
    <ol type="a">
        <li>Operating System</li>
    </ol>

    <!-- Unordered List with square bullet -->
    <ul type="square">
        <li>Operating System</li>
    </ul>

</body>

</html>
