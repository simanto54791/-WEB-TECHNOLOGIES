
<!DOCTYPE html>
<html>
<head>   
<title>Form</title>
<link rel="stylesheet" href="taskkk.css">
</head>

<body>
<form>
<h1>Registration Form</h1>
<div>
<label for="fullname">Fullname:</label>
<input type="text" name="fullname" id="fullname" required>
</div><br>

<div>
<label for="password">Password:</label>
<input type="password" name="password" id="password">
</div><br>

<div>
<label for="dob">Date of birth:</label>
<input type="date" name="dob" id="dob">
</div><br>

<div>
    <label for="photo">Choose your photo:</label>
    <input type="file" name="photo" id="photo">
</div><br>

<div>
<label for="gender">gender:</label>
<input type="radio" id="gender" name="gender" value="Male">Male
<input type="radio" id="gender2" name="gender" value="Female">Female
</div><br>

<div>
<label for="religion">religion:</label>
<input type="Checkbox" name="r1" id="r1" value="Islam">Islam
<input type="Checkbox" name="r3" id="r3" value="Hindu" checked>hindu
</div><br>

<div>
<label for="department">department:</label>
<select name="department">
<option value="CSE">CSE</option>
<option value="EEE" selected>EEE</option>
</select>
</div><br>

<div>
<label for="Adress">address:</label>
<textarea cols="5" rows="15"></textarea>
</div><br>

<div>
<input type="submit" value="register"> 
<input type="reset" value="clear" disabled>
</div>
<br>

</form>
</body>
</html>
